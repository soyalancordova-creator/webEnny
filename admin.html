<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel — Enny Toro</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F4EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="public/css/brand.css">
<style>
body{background:var(--bg-deep)}
.app{display:grid;grid-template-columns:258px 1fr;min-height:100svh}

.side{position:sticky;top:0;height:100svh;padding:1.4rem 1rem;display:flex;flex-direction:column;
  gap:1.2rem;background:linear-gradient(170deg,#231016,#140d10 60%,#0f0b0c);color:#fff;z-index:50;
  overflow-y:auto}
.side .logo{font-family:var(--serif);font-size:1.2rem;padding:.2rem .6rem 0}
.side .logo i{font-style:normal;color:var(--gold-2)}
.side .logo small{display:block;font-family:var(--sans);font-size:.56rem;letter-spacing:.28em;
  text-transform:uppercase;color:rgba(255,255,255,.45);margin-top:.25rem}
.menu{display:grid;gap:.12rem;flex:1}
.menu .grp{font-size:.55rem;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.32);
  padding:1rem .95rem .4rem}
.menu button{display:flex;align-items:center;gap:.7rem;padding:.68rem .95rem;border-radius:12px;
  font-size:.82rem;color:rgba(255,255,255,.6);text-align:left;width:100%;
  transition:background .3s,color .3s}
.menu button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5;flex:none}
.menu button:hover{color:#fff;background:rgba(255,255,255,.07)}
.menu button.on{color:#1a1210;background:linear-gradient(100deg,var(--gold-2),var(--gold))}
.side .out{display:flex;align-items:center;gap:.6rem;padding:.7rem .95rem;border-radius:12px;
  font-size:.78rem;color:rgba(255,255,255,.55);transition:color .3s,background .3s}
.side .out:hover{color:#fff;background:rgba(255,255,255,.07)}
.side .out svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}

.main{padding:clamp(1.2rem,2.4vw,2rem);min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.5rem;
  flex-wrap:wrap}
.topbar h1{font-size:clamp(1.5rem,2.8vw,2.1rem)}
.topbar .sub{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.topbar-r{display:flex;align-items:center;gap:.5rem}

.pane{display:none}
.pane.on{display:grid;gap:1.1rem;animation:fade .45s var(--ez)}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.box{border-radius:20px;padding:clamp(1.1rem,2.2vw,1.6rem);background:var(--glass);
  backdrop-filter:blur(16px) saturate(165%);-webkit-backdrop-filter:blur(16px) saturate(165%);
  border:1px solid var(--glass-brd)}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.2rem;
  flex-wrap:wrap}
.box-h h3{font-size:1.25rem}
.box-h p{font-size:.85rem;color:var(--ink-2)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.acciones{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:1.1rem}

/* métricas */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem}
.kpi{display:flex;align-items:center;gap:.85rem;padding:1.1rem 1.2rem;border-radius:18px;
  background:var(--glass);border:1px solid var(--glass-brd);
  transition:transform .5s var(--ez),box-shadow .5s var(--ez)}
.kpi:hover{transform:translateY(-5px);box-shadow:var(--shadow-s)}
.kpi .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,var(--gold-2),var(--gold))}
.kpi .ic svg{width:19px;height:19px;stroke:#1a1210;fill:none;stroke-width:1.6}
.kpi b{font-family:var(--serif);font-size:1.6rem;display:block;line-height:1}
.kpi span{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}

/* campo imagen */
.imgf{display:grid;gap:.5rem}
.imgf .pv{width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--bg-deep);
  border:1px solid var(--hair);display:grid;place-items:center}
.imgf .pv img{width:100%;height:100%;object-fit:cover}
.imgf .pv span{font-size:.75rem;color:var(--ink-3)}
.imgf .rowb{display:flex;gap:.4rem;align-items:center}
.imgf input[type=text]{flex:1;font-size:.82rem;padding:.6rem .8rem}

/* filas de colección */
.item{border-radius:18px;border:1px solid var(--hair);background:var(--glass-2);padding:1.1rem;
  display:grid;gap:.85rem;margin-bottom:.9rem}
.item-h{display:flex;align-items:center;justify-content:space-between;gap:.8rem}
.item-h b{font-family:var(--serif);font-size:1.05rem;font-weight:500}
.item-h .n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:var(--fill);color:var(--fill-ink);font-size:.7rem}
.ico-btn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3);
  border:1px solid var(--hair);transition:color .3s,border-color .3s,background .3s}
.ico-btn:hover{color:var(--err);border-color:var(--err)}
.ico-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}

/* galería admin */
.galadm{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
.gitem{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1;background:var(--bg-deep);
  border:1px solid var(--hair)}
.gitem img{width:100%;height:100%;object-fit:cover}
.gitem .x{position:absolute;top:.4rem;right:.4rem;width:26px;height:26px;border-radius:8px;
  display:grid;place-items:center;background:rgba(20,17,16,.66);color:#fff;opacity:0;transition:opacity .3s}
.gitem:hover .x{opacity:1}
.gitem .x svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.gitem .cp{position:absolute;left:0;right:0;bottom:0;padding:.35rem .5rem;font-size:.68rem;
  background:rgba(20,17,16,.6);color:#fff;border:none;text-align:center}
.gadd{border:1.5px dashed var(--hair);border-radius:14px;display:grid;place-items:center;gap:.4rem;
  aspect-ratio:1;color:var(--ink-3);cursor:pointer;transition:all .35s}
.gadd:hover{border-color:var(--gold);color:var(--gold)}
.gadd svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}

/* tabla alumnos */
.tabla{width:100%;border-collapse:collapse;font-size:.88rem}
.tabla th{text-align:left;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-3);padding:.7rem .8rem;border-bottom:1px solid var(--hair);font-weight:400}
.tabla td{padding:.85rem .8rem;border-bottom:1px solid var(--hair);color:var(--ink-2)}
.tabla tr:hover td{background:var(--glass-2)}
.tabla .who{display:flex;align-items:center;gap:.7rem;color:var(--ink)}
.tabla .who img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--bg-deep)}
.pill{padding:.24rem .7rem;border-radius:999px;font-size:.66rem;letter-spacing:.1em;
  text-transform:uppercase;border:1px solid var(--hair);display:inline-block}
.pill.adm{background:var(--fill);color:var(--fill-ink);border-color:transparent}
.tbl-wrap{overflow-x:auto}

.vac{padding:2.6rem 1rem;text-align:center;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:1.4rem;transform:translate(-50%,140%);z-index:500;
  padding:.85rem 1.5rem;border-radius:999px;background:var(--ink);color:var(--bg);font-size:.85rem;
  box-shadow:var(--shadow);transition:transform .5s var(--ez)}
.toast.on{transform:translate(-50%,0)}

.mtop{display:none}
@media (max-width:980px){
  .kpis{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:258px;transform:translateX(-100%);
    transition:transform .45s var(--ez)}
  body.nav .side{transform:none}
  body.nav::after{content:'';position:fixed;inset:0;z-index:40;background:rgba(12,9,8,.5)}
  .mtop{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;
    background:var(--glass);border:1px solid var(--glass-brd)}
  .mtop svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.6}
}
</style>
</head>
<body>
<div class="cur"></div><div class="cur-r"></div>

<div class="app">
  <aside class="side">
    <a href="index.html" class="logo"><b>Enny</b> <i>Toro</i><small>Panel</small></a>
    <nav class="menu" id="menu">
      <button class="on" data-p="resumen"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Resumen</button>

      <span class="grp">Pantalla de inicio</span>
      <button data-p="portada"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 15 5-4 4 3 3-2 6 4"/></svg>Portada</button>
      <button data-p="tarjetas"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="13" height="12" rx="2"/><path d="M18 8v8M21 10v4"/></svg>Tarjetas del video</button>
      <button data-p="sobre"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>Sobre mí</button>
      <button data-p="servicios"><svg viewBox="0 0 24 24"><path d="m12 3 2.6 5.6 6.4.8-4.7 4.3 1.3 6.3-5.6-3.1-5.6 3.1 1.3-6.3L3 9.4l6.4-.8z"/></svg>Servicios</button>
      <button data-p="galeria"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.6"/><path d="m3 16 5-4 4 3 3-2 6 4"/></svg>Galería</button>

      <button data-p="biblioteca"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h5v18H6a2 2 0 0 1-2-2z"/><path d="M13 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5z"/></svg>Biblioteca</button>
      <button data-p="academia"><svg viewBox="0 0 24 24"><path d="m12 4 9 5-9 5-9-5z"/><path d="M6 11.5V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-4.5"/></svg>Academia</button>

  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:.8rem">
        <button class="mtop" id="mtop" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div><span class="sub">Panel administrativo</span><h1 id="tit">Resumen</h1></div>

        <a href="index.html" target="_blank" rel="noopener" class="tag">Ver el sitio ↗</a>

          <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="public/js/config.js"></script>
<script src="public/js/app.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
'use strict';
var A = window.EnnyApp;
A.iniciarTema(); A.iniciarCursor();

if (!A.listo) {
  document.body.innerHTML = '<div style="min-height:100svh;display:grid;place-items:center;padding:2rem;text-align:center">' +
    '<div><h2 style="font-family:var(--serif);font-size:2rem;margin-bottom:1rem">Panel no disponible</h2>' +
    '<p class="muted" style="margin-bottom:1.6rem;max-width:44ch">Falta conectar Supabase. Edita <code>public/js/config.js</code> con la URL y la anon key de tu proyecto.</p>' +
    '<a href="index.html" class="btn btn-fill"><span>Volver al inicio</span></a></div></div>';
  return;
}

var $ = function (s, r) { return (r || document).querySelector(s); };
var esc = A.esc;

/* ---------- toast ---------- */
var toastT;
function toast(txt) {
  var t = $('#toast');
  t.textContent = txt; t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(function () { t.classList.remove('on'); }, 2600);
}

/* ---------- navegación ---------- */
var TIT = { resumen:'Resumen', portada:'Portada', tarjetas:'Tarjetas del video', sobre:'Sobre mí',
  servicios:'Servicios', galeria:'Galería', contacto:'Contacto', blog:'Blog',
  biblioteca:'Biblioteca', academia:'Academia y comunidad', alumnos:'Alumnos' };
var cargado = {};
function abrir(p) {
  document.querySelectorAll('.pane').forEach(function (s) { s.classList.toggle('on', s.dataset.pane === p); });
  document.querySelectorAll('#menu button').forEach(function (b) { b.classList.toggle('on', b.dataset.p === p); });
  $('#tit').textContent = TIT[p] || 'Panel';
  document.body.classList.remove('nav');
  location.hash = p;
  if (!cargado[p] && RENDER[p]) { cargado[p] = true; RENDER[p](); }
}
$('#menu').addEventListener('click', function (e) {
  var b = e.target.closest('[data-p]'); if (b) abrir(b.dataset.p);
});
$('#mtop').addEventListener('click', function () { document.body.classList.toggle('nav'); });
$('#salir').addEventListener('click', function () {
  A.salir().then(function () { location.href = 'index.html'; });
});

/* ============================================================
   CAMPO DE IMAGEN reutilizable
============================================================ */
var idSeq = 0;
function campoImagen(label, valor, onChange) {
  var id = 'im' + (++idSeq);
  var wrap = document.createElement('div');
  wrap.className = 'fld imgf';
  wrap.innerHTML =
    '<label>' + esc(label) + '</label>' +
    '<div class="pv">' + (valor ? '<img src="' + esc(valor) + '" alt="">' : '<span>Sin imagen</span>') + '</div>' +
    '<div class="rowb">' +
      '<input type="text" value="' + esc(valor || '') + '" placeholder="Ruta o URL de la imagen">' +
      '<label class="tag" style="cursor:pointer;white-space:nowrap">Subir' +
        '<input type="file" accept="image/*" hidden id="' + id + '"></label>' +
    '</div>';
  var pv = wrap.querySelector('.pv');
  var txt = wrap.querySelector('input[type=text]');
  var file = wrap.querySelector('input[type=file]');

  function set(v) {
    txt.value = v;
    pv.innerHTML = v ? '<img src="' + esc(v) + '" alt="">' : '<span>Sin imagen</span>';
    if (onChange) onChange(v);
  }
  txt.addEventListener('input', function () { set(txt.value); });
  file.addEventListener('change', function () {
    var f = file.files[0]; if (!f) return;
    if (f.size > 6 * 1024 * 1024) { toast('La imagen debe pesar menos de 6 MB'); return; }
    toast('Subiendo imagen…');
    var ext = (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
    A.subir('media', 'sitio/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '.' + ext, f)
      .then(function (url) { set(url); toast('Imagen subida'); })
      .catch(function (e) { toast(e.message || 'No se pudo subir'); });
  });
  wrap.leer = function () { return txt.value.trim(); };
  return wrap;
}

function campoTexto(label, valor, tipo, hint) {
  var wrap = document.createElement('div');
  wrap.className = 'fld';
  var control = tipo === 'area'
    ? '<textarea>' + esc(valor || '') + '</textarea>'
    : '<input type="' + (tipo === 'num' ? 'number' : 'text') + '" value="' + esc(valor || '') + '">';
  wrap.innerHTML = '<label>' + esc(label) + '</label>' + control +
    (hint ? '<span class="hint">' + esc(hint) + '</span>' : '');
  var c = wrap.querySelector('textarea,input');
  wrap.leer = function () { return c.value.trim(); };
  return wrap;
}

/* ============================================================
   EDITOR GENÉRICO DE BLOQUE JSON
============================================================ */
function editorBloque(pane, key, titulo, desc, campos) {
  var box = document.createElement('div');
  box.className = 'box';
  box.innerHTML = '<div class="box-h"><div><h3>' + esc(titulo) + '</h3>' +
    (desc ? '<p>' + esc(desc) + '</p>' : '') + '</div></div>';
  var cont = document.createElement('div');
  cont.className = 'grid2';
  box.appendChild(cont);
  var acc = document.createElement('div');
  acc.className = 'acciones';
  acc.innerHTML = '<button class="btn btn-fill btn-sm"><span>Guardar cambios</span></button>';
  box.appendChild(acc);
  pane.appendChild(box);

  A.bloque(key).then(function (data) {
    data = data || {};
    var campo = {};
    campos.forEach(function (c) {
      var el = c.t === 'img'
        ? campoImagen(c.l, data[c.k], null)
        : campoTexto(c.l, data[c.k], c.t, c.hint);
      if (c.ancho) el.style.gridColumn = '1/-1';
      campo[c.k] = el;
      cont.appendChild(el);
    });
    acc.querySelector('button').addEventListener('click', function () {
      var out = Object.assign({}, data);
      campos.forEach(function (c) { out[c.k] = campo[c.k].leer(); });
      A.guardarBloque(key, out).then(function (r) {
        toast(r.error ? ('Error: ' + r.error.message) : 'Guardado');
        if (!r.error) data = out;
      });
    });
  });
}

/* ============================================================
   EDITOR GENÉRICO DE COLECCIÓN
============================================================ */
function editorLista(pane, tabla, titulo, desc, campos, opts) {
  opts = opts || {};
  var box = document.createElement('div');
  box.className = 'box';
  box.innerHTML = '<div class="box-h"><div><h3>' + esc(titulo) + '</h3>' +
    (desc ? '<p>' + esc(desc) + '</p>' : '') + '</div>' +
    '<button class="btn btn-ghost btn-sm js-add"><span>+ Añadir</span></button></div>' +
    '<div class="js-list"></div>';
  pane.appendChild(box);
  var lista = box.querySelector('.js-list');

  function fila(row, i) {
    var it = document.createElement('div');
    it.className = 'item';
    it.innerHTML = '<div class="item-h"><b><span class="n">' + (i + 1) + '</span></b>' +
      '<button class="ico-btn js-del" title="Eliminar"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>';
    var titEl = it.querySelector('b');
    var cont = document.createElement('div');
    cont.className = 'grid2';
    it.appendChild(cont);

    var campo = {};
    campos.forEach(function (c) {
      var el = c.t === 'img' ? campoImagen(c.l, row[c.k], null) : campoTexto(c.l, row[c.k], c.t, c.hint);
      if (c.ancho) el.style.gridColumn = '1/-1';
      campo[c.k] = el;
      cont.appendChild(el);
    });
    function refrescarTitulo() {
      var t = campo[opts.etiqueta || campos[0].k];
      titEl.innerHTML = '<span class="n">' + (i + 1) + '</span> ' + esc(t ? t.leer() : '');
    }
    refrescarTitulo();
    cont.addEventListener('input', refrescarTitulo);

    var acc = document.createElement('div');
    acc.className = 'acciones';
    acc.innerHTML = '<button class="btn btn-fill btn-sm js-save"><span>Guardar</span></button>';
    it.appendChild(acc);

    it.querySelector('.js-save').addEventListener('click', function () {
      var out = { position: i + 1 };
      campos.forEach(function (c) {
        var v = campo[c.k].leer();
        out[c.k] = c.t === 'num' ? (v === '' ? null : +v) : v;
      });
      if (opts.antesGuardar) opts.antesGuardar(out, row);
      var q = row.id
        ? A.sb.from(tabla).update(out).eq('id', row.id)
        : A.sb.from(tabla).insert(out);
      q.then(function (r) {
        toast(r.error ? ('Error: ' + r.error.message) : 'Guardado');
        if (!r.error) cargar();
      });
    });
    it.querySelector('.js-del').addEventListener('click', function () {
      if (!row.id) { it.remove(); return; }
      if (!confirm('¿Eliminar «' + (row[campos[0].k] || 'este elemento') + '»?')) return;
      A.sb.from(tabla).delete().eq('id', row.id).then(function (r) {
        toast(r.error ? ('Error: ' + r.error.message) : 'Eliminado');
        cargar();
      });
    });
    return it;
  }

  function cargar() {
    lista.innerHTML = '<div class="vac"><span class="spin"></span></div>';
    var q = A.sb.from(tabla).select('*');
    q = opts.orden ? q.order(opts.orden, { ascending: false }) : q.order('position', { ascending: true });
    q.then(function (r) {
      var rows = r.data || [];
      lista.innerHTML = '';
      if (!rows.length) lista.innerHTML = '<div class="vac">Todavía no hay elementos. Pulsa «Añadir».</div>';
      rows.forEach(function (row, i) { lista.appendChild(fila(row, i)); });
    });
  }
  box.querySelector('.js-add').addEventListener('click', function () {
    if (lista.querySelector('.vac')) lista.innerHTML = '';
    lista.appendChild(fila(Object.assign({}, opts.nuevo || {}), lista.children.length));
  });
  cargar();
}

RENDER.galeria = function () {
  var p = $('[data-pane=galeria]');

  box.innerHTML = '<div class="box-h"><div><h3>Galería</h3>' +

    '<div class="galadm js-g"></div>';
  p.appendChild(box);
  var g = box.querySelector('.js-g');

  function cargar() {
    g.innerHTML = '<div class="vac"><span class="spin"></span></div>';
    A.lista('gallery').then(function (rows) {
      g.innerHTML = rows.map(function (r) {
        return '<div class="gitem" data-id="' + r.id + '">' +
          '<img src="' + esc(r.image_url) + '" alt="">' +
          '<button class="x"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>' +
          '<input class="cp" value="' + esc(r.caption || '') + '" placeholder="Pie de foto"></div>';
      }).join('') +
        '<label class="gadd"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>' +
        '<span style="font-size:.74rem">Añadir</span>' +
        '<input type="file" accept="image/*" multiple hidden class="js-file"></label>';
    });
  }
  g.addEventListener('click', function (e) {
    var x = e.target.closest('.x');
    if (!x) return;
    var it = x.closest('.gitem');
    if (!confirm('¿Quitar esta foto de la galería?')) return;
    A.sb.from('gallery').delete().eq('id', it.dataset.id).then(function () { toast('Eliminada'); cargar(); });
  });
  g.addEventListener('change', function (e) {
    if (!e.target.classList.contains('js-file')) return;
    var files = [].slice.call(e.target.files);
    if (!files.length) return;
    toast('Subiendo ' + files.length + ' foto(s)…');
    Promise.all(files.map(function (f, i) {
      var ext = (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
      return A.subir('media', 'galeria/' + Date.now() + '-' + i + '.' + ext, f)
        .then(function (url) { return { image_url: url, caption: '', position: 99, active: true }; });
    })).then(function (nuevas) {
      return A.sb.from('gallery').insert(nuevas);
    }).then(function () { toast('Fotos añadidas'); cargar(); })
      .catch(function (err) { toast(err.message || 'Error al subir'); });
  });
  g.addEventListener('blur', function (e) {
    if (!e.target.classList.contains('cp')) return;
    var it = e.target.closest('.gitem');
    A.sb.from('gallery').update({ caption: e.target.value.trim() }).eq('id', it.dataset.id)
      .then(function () { toast('Pie de foto guardado'); });
  }, true);
  cargar();
};

var ICOS = {
  alumnos:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6"/></svg>',

  ok:'<svg viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></svg>',
  doc:'<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'
};
function kpi(ic, n, l) {
  return '<div class="kpi"><div class="ic">' + ic + '</div><div><b>' + n + '</b><span>' + l + '</span></div></div>';
}
function resumen() {
  A.sb.from('admin_stats').select('*').maybeSingle().then(function (r) {
    var s = r.data;
    if (!s) {
      // sin la vista, contamos a mano
      return A.sb.from('profiles').select('id,created_at').then(function (q) {
        var rows = q.data || [];
        var d7 = rows.filter(function (u) {
          return Date.now() - new Date(u.created_at) < 7 * 86400000; }).length;
        $('#kpis').innerHTML = kpi(ICOS.alumnos, rows.length, 'Alumnos') + kpi(ICOS.nuevo, d7, 'Nuevos · 7 días');
      });
    }
    $('#kpis').innerHTML =
      kpi(ICOS.alumnos, s.total_alumnos, 'Alumnos') +
      kpi(ICOS.nuevo, s.nuevos_7d, 'Nuevos · 7 días') +
      kpi(ICOS.ok, s.verificados, 'Correos verificados') +
      kpi(ICOS.doc, s.recursos, 'Recursos publicados');
  });
  A.sb.from('profiles').select('*').order('created_at', { ascending: false }).limit(6)
    .then(function (r) {
      var rows = r.data || [];
      $('#ultimos').innerHTML = rows.length
        ? rows.map(filaAlumno).join('')
        : '<tr><td><div class="vac">Todavía no hay cuentas creadas.</div></td></tr>';
    });
}

/* ---------- arranque ---------- */
A.exigirAdmin().then(function (p) {
  if (!p) return;
  resumen();
  var h = (location.hash || '').replace('#', '');
  if (TIT[h]) abrir(h); else cargado.resumen = true;
});
