<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hosannia</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D1321">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="public/img/hosannia-icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="public/img/hosannia-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hosannia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="public/css/brand.css">
<link rel="stylesheet" href="public/css/hosannia.css">
<link rel="stylesheet" href="public/css/campus.css">
<link rel="modulepreload" href="public/js/campus/main.js">
</head>
<body class="cx-body">
<div class="cx">
  <!-- riel de iconos siempre visible (escritorio) -->
  <aside class="cx-rail" id="rail" aria-label="Accesos"></aside>
  <!-- panel con etiquetas: fijo en escritorio, deslizante en móvil -->
  <aside class="cx-side" id="side" aria-label="Navegación"></aside>
  <div class="cx-scrim" id="scrim" hidden></div>
  <main class="cx-main">
    <header class="cx-top">
      <button class="cx-iconbtn" id="hamb" aria-label="Menú"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <a class="cx-toplogo" href="#/" aria-label="Hosannia">
        <img class="lg-light" src="public/img/hosannia-logo.png" alt="Hosannia">
        <img class="lg-dark" src="public/img/hosannia-logo-dark.png" alt="Hosannia">
      </a>
      <button class="cx-iconbtn" id="bell" aria-label="Notificaciones"><svg class="ic" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2H4.5z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="dot" id="bellDot" hidden></span></button>
      <button class="top-av" id="topAv" aria-label="Mi perfil"></button>
    </header>
    <div class="cx-view" id="view" tabindex="-1"><div class="cx-empty"><span class="spin"></span></div></div>
  </main>
</div>
<nav class="cx-tabs" id="tabs" aria-label="Navegación inferior"></nav>
<noscript><p style="padding:2rem;text-align:center">Hosannia necesita JavaScript activado.</p></noscript>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="public/js/config.js"></script>
<script src="public/js/app.js"></script>
<script type="module" src="public/js/campus/main.js"></script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
