<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Academia Enny Toro</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1b0f12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="public/css/brand.css">
<link rel="stylesheet" href="public/css/campus.css">
<link rel="modulepreload" href="public/js/campus/main.js">
</head>
<body class="cx-body">
<div class="cx">
  <aside class="cx-side" id="side" aria-label="Navegación"></aside>
  <main class="cx-main">
    <header class="cx-top">
      <button class="cx-iconbtn cx-hamb" id="hamb" aria-label="Menú"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <form class="cx-search" id="searchForm" role="search">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="searchInput" placeholder="Busca obras, comunidades o personas" aria-label="Buscar">
        <kbd>Ctrl K</kbd>
      </form>
      <span class="sp"></span>
      <button class="cx-iconbtn" id="themeBtn" aria-label="Cambiar tema"></button>
      <button class="cx-iconbtn" id="bell" aria-label="Notificaciones"><svg class="ic" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2H4.5z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="dot" id="bellDot" hidden></span></button>
    </header>
    <div class="cx-view" id="view" tabindex="-1"><div class="cx-empty"><span class="spin"></span></div></div>
  </main>
</div>
<nav class="cx-tabs" id="tabs" aria-label="Navegación inferior"></nav>
<noscript><p style="padding:2rem;text-align:center">La plataforma necesita JavaScript activado.</p></noscript>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="public/js/config.js"></script>
<script src="public/js/app.js"></script>
<script type="module" src="public/js/campus/main.js"></script>
</body>
</html>
